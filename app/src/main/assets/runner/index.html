<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>سباق نور القرآن 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c9ed;font-family:Tahoma,Arial;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.pill{background:#073d36e8;color:white;border:2px solid #f4d17d;border-radius:16px;padding:8px 11px;font-weight:bold;font-size:14px;text-shadow:0 1px 2px #123}
#world{position:absolute;top:62px;left:50%;transform:translateX(-50%);color:#fff;background:#123c36aa;border-radius:20px;padding:5px 13px;font-size:12px;pointer-events:none}
#touchHint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#073d36c9;color:#fff;border:1px solid #f4d17d;border-radius:18px;padding:9px 14px;font-size:13px;white-space:nowrap;pointer-events:none}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#052e2b99;padding:18px}
.panel{width:min(92%,390px);background:linear-gradient(145deg,#fff5d7,#d8f5e8);border:4px solid #e4b95f;border-radius:25px;padding:20px;text-align:center;color:#17483e;box-shadow:0 12px 35px #073d3666}
h1{font-size:24px;margin:5px 0 9px}.sub{font-size:14px;line-height:1.8}
button.start{border:0;border-radius:15px;padding:13px 24px;background:#16845d;color:white;font-size:18px;font-weight:bold;margin:8px;box-shadow:0 4px 0 #07543d}
#toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:#073d36dd;color:white;padding:8px 15px;border-radius:18px;display:none}
</style><script src="three.min.js"></script><script src="GLTFLoader.js"></script></head>
<body>
<canvas id="gl"></canvas>
<div id="hud"><div class="pill" id="level">المرحلة 1</div><div class="pill" id="score">⭐ 0</div><div class="pill" id="coins">🪙 0</div><div class="pill" id="best">أفضل: 0</div></div>
<div id="world">🌳 الغابة الخضراء</div>
<div id="touchHint">المس اللاعب للقفز • اسحب يميناً أو يساراً لتغيير الاتجاه</div>
<div id="toast"></div>
<div id="message"><div class="panel"><div style="font-size:48px">🌈🏃⭐</div><h1>سباق نور القرآن 3D</h1><div class="sub">المس الشخصية للقفز، واسحب يميناً أو يساراً لتغيير المسار. اجمع النجوم وتجنب المطبات والحواجز!</div><button class="start" id="start">ابدأ السباق</button><div class="sub">اللعبة تعمل دون إنترنت • النقاط للترفيه داخل اللعبة فقط</div></div></div>
<script>
(()=> {
const $=id=>document.getElementById(id), overlay=$('message'), canvas=$('gl');
if(!window.THREE||!THREE.GLTFLoader){$('message').innerHTML='<div class="panel"><h1>تعذر تحميل محرك 3D</h1><p>ملفات المحرك المحلية غير موجودة.</p></div>';return;}
let scene=new THREE.Scene(); scene.background=new THREE.Color(0x82cbe8); scene.fog=new THREE.Fog(0x82cbe8,24,78);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,120);camera.position.set(0,4.6,8.8);camera.lookAt(0,1,-5);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;if(THREE.ACESFilmicToneMapping!==undefined){renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;}
scene.add(new THREE.HemisphereLight(0xd9efff,0x40533b,1.15));
const sun=new THREE.DirectionalLight(0xffe4bd,1.35);sun.position.set(-5,10,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const worlds=[
{name:'🌳 الغابة الخضراء',sky:0x82cbe8,ground:0x557d4b,road:0x30343a,leaf:0x276b39,bark:0x59402c},
{name:'🏜️ الصحراء الذهبية',sky:0xe6b978,ground:0xc69b5e,road:0x62503d,leaf:0x786039,bark:0x765536},
{name:'🌆 مدينة المستقبل',sky:0x596b91,ground:0x424c5d,road:0x242a35,leaf:0x347d78,bark:0x4b5260}
];
let world=0,score=0,coins=+(localStorage.getItem('noorRunner3DCoins')||0),best=+(localStorage.getItem('noorRunner3DBest')||0),lane=0,jump=0,slide=0,run=false,elapsed=0,spawn=0,speed=8,last=0,items=[];
$('best').textContent='أفضل: '+best;$('coins').textContent='🪙 '+coins;
let ground,road,roadTexture=null,trees=[],decor=[],waterMeshes=[],nightLights=[],player=null,mixer=null,runAction=null,modelReady=false;
let particles=[],cameraShake=0,jumpPhase=0,slideLean=0,worldClock=0,atmosphere=null,atmospherePositions=null,atmosphereVelocities=null;
function mat(color,roughness=.88){return new THREE.MeshStandardMaterial({color,roughness})}
function addBox(parent,x,y,z,sx,sy,sz,material){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function makeTree(x,z){let g=new THREE.Group();let bark=addBox(g,0,.9,0,.34,1.8,.34,mat(worlds[world].bark));for(let k=0;k<3;k++){let crown=new THREE.Mesh(new THREE.SphereGeometry(.8-k*.1,16,12),mat(worlds[world].leaf));crown.position.set((k-1)*.38,2.05+(k%2)*.35,0);crown.scale.set(1,1.15,1);crown.castShadow=true;g.add(crown)}g.position.set(x,0,z);scene.add(g);trees.push(g)}
function buildWorld(){
 if(atmosphere){scene.remove(atmosphere);if(atmosphere.geometry)atmosphere.geometry.dispose();if(atmosphere.material)atmosphere.material.dispose();atmosphere=null;}
 const night=world===2;
 scene.background.setHex(night?0x07152d:worlds[world].sky);scene.fog.color.setHex(night?0x101d36:worlds[world].sky);
 sun.intensity=night?.22:1.35;sun.color.setHex(night?0x91baff:0xffe4bd);
 if(ground)scene.remove(ground);if(road)scene.remove(road);trees.forEach(t=>scene.remove(t));trees=[];
 decor.forEach(o=>scene.remove(o));decor=[];waterMeshes=[];nightLights.forEach(o=>scene.remove(o));nightLights=[];
 ground=new THREE.Mesh(new THREE.PlaneGeometry(48,120),mat(worlds[world].ground));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.12,-30);ground.receiveShadow=true;scene.add(ground);
 // سطح إسفلت ناعم بنقشة دقيقة يعمل محلياً دون إنترنت
 const asphalt=document.createElement('canvas');asphalt.width=256;asphalt.height=512;const ctx=asphalt.getContext('2d');ctx.fillStyle=world===0?'#34383b':(world===1?'#5b5045':'#252d3a');ctx.fillRect(0,0,256,512);for(let i=0;i<4200;i++){let v=75+Math.random()*90;ctx.fillStyle='rgba('+v+','+v+','+v+',0.12)';ctx.fillRect(Math.random()*256,Math.random()*512,1+Math.random()*2,1+Math.random()*2);}const asphaltTex=new THREE.CanvasTexture(asphalt);asphaltTex.wrapS=THREE.RepeatWrapping;asphaltTex.wrapT=THREE.RepeatWrapping;asphaltTex.repeat.set(2,18);asphaltTex.anisotropy=4;roadTexture=asphaltTex;
 road=new THREE.Mesh(new THREE.PlaneGeometry(7.6,120),new THREE.MeshStandardMaterial({map:asphaltTex,color:0xffffff,roughness:.96,metalness:.01}));road.rotation.x=-Math.PI/2;road.position.set(0,-.045,-30);road.receiveShadow=true;scene.add(road);
 // حواف طريق مرتبة وعاكسات ضوئية جانبية
 for(let side of [-1,1]){let curb=addBox(scene,side*3.88,.035,-30,.22,.12,120,mat(world===2?0x536b8b:0xd7d0bd));curb.userData.static=true;decor.push(curb);for(let z=-82;z<8;z+=8){let reflector=addBox(scene,side*3.72,.13,z,.12,.12,.34,mat(world===2?0x71c8ff:0xf2c75c));decor.push(reflector);}}
 // أعمدة إنارة أنيقة على جانبي المسار
 for(let z=-70;z<6;z+=18)for(let side of [-1,1]){let pole=new THREE.Group();let dark=mat(world===2?0x34445e:0x4c5352);addBox(pole,0,1.7,0,.12,3.4,.12,dark);addBox(pole,side*.42,3.25,0,.9,.12,.12,dark);let bulb=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),new THREE.MeshBasicMaterial({color:world===2?0x8acfff:0xffe3a1}));bulb.position.set(side*.78,3.15,0);pole.add(bulb);if(world===2){let lamp=new THREE.PointLight(0x78baff,1.1,8);lamp.position.copy(bulb.position);pole.add(lamp);}pole.position.set(side*5.3,0,z);scene.add(pole);decor.push(pole);}
 
 for(let z=-72;z<8;z+=4){for(let side of [-1,1])makeTree(side*5.2,z);}
 for(let x of [-1.25,1.25])for(let z=-84;z<8;z+=7){let line=addBox(scene,x,-.025,z,.04,.02,3.2,mat(night?0x9bc8ff:0xd6c59b));decor.push(line);}
 // جسر حجري فوق الطريق في عالم الغابة والصحراء
 if(world!==2){
  let bridge=new THREE.Group();let stone=mat(world===0?0x777c78:0x9a7953);
  addBox(bridge,0,4.0,-27,10,.65,1.35,stone);
  for(let x of [-4.1,4.1])addBox(bridge,x,2.1,-27,1,4.2,1.25,stone);
  let rail=addBox(bridge,0,4.45,-27,8,.12,1.1,mat(0x4e514e));bridge.position.z=-7;scene.add(bridge);decor.push(bridge);
  // شلال جانبي ومجرى ماء لامع
  let stream=new THREE.Mesh(new THREE.PlaneGeometry(2.1,3.8),new THREE.MeshStandardMaterial({color:0x38bde8,transparent:true,opacity:.78,roughness:.16,metalness:.18,side:THREE.DoubleSide}));
  stream.position.set(-8,2,-24);stream.userData.water=true;scene.add(stream);waterMeshes.push(stream);decor.push(stream);
  let pool=new THREE.Mesh(new THREE.PlaneGeometry(5,7),new THREE.MeshStandardMaterial({color:0x168dbb,transparent:true,opacity:.76,roughness:.12,metalness:.22}));pool.rotation.x=-Math.PI/2;pool.position.set(-8,.015,-22);pool.userData.water=true;scene.add(pool);waterMeshes.push(pool);decor.push(pool);
 }
 // نفق حجري في المدينة بإضاءة زرقاء
 if(night){
  let tunnel=new THREE.Group(),stone=mat(0x252f43);
  addBox(tunnel,-4.2,2.1,0,.65,4.2,1.1,stone);addBox(tunnel,4.2,2.1,0,.65,4.2,1.1,stone);addBox(tunnel,0,4.1,0,8.9,.55,1.1,stone);
  let inner=addBox(tunnel,0,3.82,.58,7.8,.07,.06,mat(0x263e66));tunnel.position.z=-25;scene.add(tunnel);decor.push(tunnel);
  for(let z=-38;z<5;z+=12)for(let side of [-1,1]){let lamp=new THREE.PointLight(0x65baff,1.8,9);lamp.position.set(side*3.1,3.25,z);scene.add(lamp);nightLights.push(lamp);let bulb=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),new THREE.MeshBasicMaterial({color:0x83ceff}));bulb.position.copy(lamp.position);scene.add(bulb);nightLights.push(bulb);}
 }
}
buildWorld();
function setupAtmosphere(){
 const count=world===2?150:(world===1?70:42),positions=new Float32Array(count*3),velocities=new Float32Array(count);
 for(let i=0;i<count;i++){positions[i*3]=(Math.random()-.5)*22;positions[i*3+1]=Math.random()*10+.3;positions[i*3+2]=-75+Math.random()*85;velocities[i]=world===2?-(5+Math.random()*5):(world===1?-(.5+Math.random()*1.4):.15+Math.random()*.35);}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
 const color=world===2?0xa9cfff:(world===1?0xe6c18a:0xc9ff9b);
 const material=new THREE.PointsMaterial({color,size:world===2?.055:.085,transparent:true,opacity:world===2?.55:.72,depthWrite:false,sizeAttenuation:true});
 atmosphere=new THREE.Points(geo,material);scene.add(atmosphere);atmospherePositions=positions;atmosphereVelocities=velocities;
}
function updateAtmosphere(dt){if(!atmosphere)return;const a=atmosphere.geometry.attributes.position;for(let i=0;i<atmosphereVelocities.length;i++){let k=i*3;atmospherePositions[k+1]+=atmosphereVelocities[i]*dt;atmospherePositions[k+2]+= (world===2?speed*.35:1.1)*dt;if(atmospherePositions[k+1]<.15||atmospherePositions[k+2]>9){atmospherePositions[k]=(Math.random()-.5)*22;atmospherePositions[k+1]=world===2?Math.random()*10+2:Math.random()*6+.4;atmospherePositions[k+2]=-70-Math.random()*15;}}a.needsUpdate=true;}
setupAtmosphere();
function setWorld(n){world=n;buildWorld();setupAtmosphere();$('world').textContent=worlds[world].name;toast('وصلت إلى '+worlds[world].name)}
const loader=new THREE.GLTFLoader();
loader.load('run-maya-3d-person-animated.glb',g=>{
player=g.scene;player.scale.setScalar(1.45);player.position.set(0,0,0);player.rotation.y=Math.PI;player.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.roughness=.72;o.material.metalness=.02}}});scene.add(player);
mixer=new THREE.AnimationMixer(player);let clip=THREE.AnimationClip.findByName(g.animations,'Run')||g.animations[0];if(clip){runAction=mixer.clipAction(clip);runAction.enabled=true;runAction.setLoop(THREE.LoopRepeat,Infinity);runAction.setEffectiveWeight(1);runAction.timeScale=1;runAction.play();runAction.paused=true;}modelReady=true;$('start').disabled=false;$('start').textContent='ابدأ السباق';
},undefined,e=>{console.error(e);$('message').innerHTML='<div class="panel"><h1>تعذر تحميل الشخصية</h1><p>تأكد من وجود ملف GLB داخل مجلد runner ثم أعد البناء.</p></div>'});
$('start').disabled=true;$('start').textContent='جارٍ تحميل الشخصية...';
function obstacle(o){
 let m;
 if(o.type==='star'){
  let group=new THREE.Group();
  let ring=new THREE.Mesh(new THREE.TorusGeometry(.29,.075,12,28),new THREE.MeshStandardMaterial({color:0xffd34e,metalness:.72,roughness:.18,emissive:0x9b5c00,emissiveIntensity:.8}));
  ring.rotation.x=Math.PI/2;group.add(ring);
  let core=new THREE.Mesh(new THREE.SphereGeometry(.12,12,10),new THREE.MeshBasicMaterial({color:0xfff4b0}));group.add(core);
  let glow=new THREE.PointLight(0xffc83d,1,3);group.add(glow);m=group;m.position.set(o.l*1.55,1.3,o.z);
 }else if(o.type==='block'){
  m=new THREE.Group();
  let body=addBox(m,0,.43,0,1.18,.72,.42,mat(0xd65d32));
  for(let x of [-.36,0,.36]){let stripe=addBox(m,x,.44,.218,.16,.74,.025,mat(0xffe4a1));stripe.rotation.z=-.35;}
  addBox(m,0,.08,0,1.38,.16,.56,mat(0x444b52));
  m.position.set(o.l*1.55,0,o.z);
 }else if(o.type==='low'){
  m=new THREE.Group();
  addBox(m,0,.26,0,1.25,.22,.5,mat(0xd99a43));
  for(let x of [-.48,.48])addBox(m,x,.13,0,.12,.26,.55,mat(0x555b60));
  for(let x of [-.25,.25]){let stripe=addBox(m,x,.27,.258,.14,.22,.025,mat(0xfff0c2));stripe.rotation.z=-.45;}
  m.position.set(o.l*1.55,0,o.z);
 }else{
  m=new THREE.Group();
  let wood=mat(0x98603a);addBox(m,0,.52,0,.92,1.04,.88,wood);
  for(let y of [.12,.92])for(let z of [-.45,.45])addBox(m,0,y,z,.94,.07,.055,mat(0xd0a16b));
  for(let x of [-.46,.46])addBox(m,x,.52,0,.055,1.04,.9,mat(0x593d2d));
  m.position.set(o.l*1.55,0,o.z);
 }
 if(m){m.traverse?.(x=>{if(x.isMesh){x.castShadow=true;x.receiveShadow=true}});scene.add(m);o.mesh=m;}
}
function spawnItem(){let r=Math.random(),o={l:Math.floor(Math.random()*3)-1,z:-36,type:r<.58?'star':(r<.76?'block':(r<.9?'low':'crate'))};obstacle(o);items.push(o)}
function burst(x,y,z,color,count=12,power=2){for(let i=0;i<count;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.045,6,6),new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}));m.position.set(x,y,z);scene.add(m);particles.push({mesh:m,vx:(Math.random()-.5)*power,vy:Math.random()*power*.9,vz:(Math.random()-.5)*power,life:.45+Math.random()*.45,max:.9})}}
function dustTrail(){if(!player||Math.random()>.65)return;let m=new THREE.Mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0xc9b99a,transparent:true,opacity:.48}));m.position.set(player.position.x+(Math.random()-.5)*.35,.08,player.position.z+.45);scene.add(m);particles.push({mesh:m,vx:(Math.random()-.5)*.35,vy:.35+Math.random()*.35,vz:.8,life:.35,max:.35})}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.vy-=2.8*dt;p.mesh.material.opacity=Math.max(0,p.life/p.max);p.mesh.scale.multiplyScalar(1+dt*1.8);if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();particles.splice(i,1)}}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1100)}
function start(){if(!modelReady)return;score=0;lane=0;jump=0;jumpPhase=0;slide=0;slideLean=0;speed=8;elapsed=0;spawn=0;items.forEach(o=>scene.remove(o.mesh));items=[];particles.forEach(p=>scene.remove(p.mesh));particles=[];world=0;buildWorld();if(roadTexture)roadTexture.offset.y=0;setupAtmosphere();$('world').textContent=worlds[0].name;run=true;if(runAction)runAction.paused=false;overlay.style.display='none';$('score').textContent='⭐ 0';$('coins').textContent='🪙 '+coins;cameraShake=0;}
function end(){run=false;if(runAction)runAction.paused=true;let bonus=Math.floor(score/100);if(bonus>0){coins+=bonus;localStorage.setItem('noorRunner3DCoins',coins);$('coins').textContent='🪙 '+coins;}if(score>best){best=score;localStorage.setItem('noorRunner3DBest',best);$('best').textContent='أفضل: '+best}overlay.innerHTML='<div class="panel"><div style="font-size:45px">🏁⭐</div><h1>انتهى السباق!</h1><div class="sub">نتيجتك: '+score+' نقطة<br>مكافأة الإنهاء: '+bonus+' عملات<br>رصيدك: '+coins+' عملة<br>أفضل نتيجة: '+best+'</div><button class="start" id="again">العب مرة أخرى</button></div>';overlay.style.display='flex';$('again').onclick=start}
function move(d){if(run)lane=Math.max(-1,Math.min(1,lane+d))}function doJump(){if(run&&jump===0&&slide===0){jump=1;jumpPhase=0;burst(player?player.position.x:0,.25,0,0xd8f4ff,7,1.1)}}function doSlide(){if(run&&jump===0){slide=1;slideLean=0;burst(player?player.position.x:0,.12,.2,0xc5b79b,5,.7)}}
function update(dt){if(!run)return;elapsed+=dt;worldClock+=dt;speed=Math.min(19,8+elapsed*.15);if(roadTexture){roadTexture.offset.y=(roadTexture.offset.y+dt*speed*.018)%1;}trees.forEach(t=>{t.position.z+=speed*dt;if(t.position.z>9)t.position.z=-72-Math.random()*12});decor.forEach(o=>{if(!o.userData.static&&o.geometry&&o.geometry.type==='BoxGeometry'&&Math.abs(o.position.y)<.1){o.position.z+=speed*dt;if(o.position.z>8)o.position.z=-86}});dustTrail();spawn-=dt;if(spawn<=0){spawnItem();spawn=.85+Math.random()*.35}if(jump>0){jumpPhase+=dt*2.6;jump=Math.max(0,1-jumpPhase);if(jump===0)jumpPhase=0}slide=Math.max(0,slide-dt*1.8);
for(let i=items.length-1;i>=0;i--){let o=items[i];o.z+=speed*dt;o.mesh.position.z=o.z;if(o.type==='star'){o.mesh.rotation.y+=dt*2.4;o.mesh.position.y=1.3+Math.sin(worldClock*5+o.z)*.12}else{o.mesh.rotation.y+=dt*.65;o.mesh.rotation.x+=dt*.25;}if(o.z>-.8&&o.z<1&&o.l===lane){if(o.type==='star'){score+=10;coins+=1;localStorage.setItem('noorRunner3DCoins',coins);$('coins').textContent='🪙 '+coins;burst(o.mesh.position.x,o.mesh.position.y,o.mesh.position.z,0xffd34e,20,2.8);cameraShake=.08;scene.remove(o.mesh);items.splice(i,1);$('score').textContent='⭐ '+score}else if((o.type==='block'&&jump<.4)||(o.type==='crate'&&jump<.52)||(o.type==='low'&&slide<.3)){burst(player.position.x,.8,.1,0xff704d,18,2.2);cameraShake=.22;end();return}}}
items=items.filter(o=>{if(o.z>4){scene.remove(o.mesh);o.mesh.traverse?.(x=>{if(x.geometry)x.geometry.dispose();if(x.material){if(Array.isArray(x.material))x.material.forEach(m=>m.dispose());else x.material.dispose()}});return false}return true});let nw=Math.floor(elapsed/24)%3;if(nw!==world)setWorld(nw);$('level').textContent='المرحلة '+(1+Math.floor(score/100));
}
function animate(ts){requestAnimationFrame(animate);let dt=Math.min((ts-last)/1000||0,.04);last=ts;waterMeshes.forEach((w,i)=>{w.material.opacity=.62+Math.sin(ts*.003+i)*.12;w.position.x+=(i===0?Math.sin(ts*.001)*.0008:0)});update(dt);updateAtmosphere(dt);if(player){player.position.x+=(lane*1.55-player.position.x)*Math.min(1,dt*9);player.position.y=(jump>0?Math.sin((1-jump)*Math.PI)*1.45:0)-(slide>0?.28:0);player.rotation.x+=(slide>0?-.48:jump>0?-.08:0-player.rotation.x)*Math.min(1,dt*10);player.rotation.z+=(lane*-.07-player.rotation.z)*Math.min(1,dt*8);let runBounce=Math.sin(worldClock*18)*.025;player.position.y+=runBounce;if(mixer){if(runAction){runAction.paused=!run;runAction.timeScale=1.05+Math.min(.55,(speed-8)*.055);}mixer.update(dt)}}cameraShake=Math.max(0,cameraShake-dt*.7);camera.position.y=4.6+Math.sin(worldClock*18)*.035+(Math.random()-.5)*cameraShake;camera.position.x+=(lane*.22-camera.position.x)*Math.min(1,dt*2);camera.lookAt(0,1.05,-5);updateParticles(dt);renderer.render(scene,camera)}
