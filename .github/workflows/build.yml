name: Build NoorAlQuran APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download offline 3D game models
        run: |
          mkdir -p app/src/main/assets/runner/models
          curl -L --fail --retry 3 "https://cdn.vibegamer.io/assets/tree-oak-kenney/642578b999/tree-oak-kenney.glb" -o app/src/main/assets/runner/models/tree-oak.glb
          curl -L --fail --retry 3 "https://cdn.vibegamer.io/assets/crate-kenney/df580ca195/crate-kenney.glb" -o app/src/main/assets/runner/models/crate.glb
          curl -L --fail --retry 3 "https://cdn.vibegamer.io/assets/coin-gold-kenney/777bae4fb0/coin-gold-kenney.glb" -o app/src/main/assets/runner/models/gold-coin.glb

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NoorAlQuran-APK
          path: app/build/outputs/apk/debug/*.apk
